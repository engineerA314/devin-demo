services:
  controller:
    build:
      context: ./apps/controller
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
      SUPERSET_INTERNAL_URL: ${SUPERSET_INTERNAL_URL:-http://host.docker.internal:9001}
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:-http://localhost:9001}
      SUPERSET_DASHBOARD_ID: ${SUPERSET_DASHBOARD_ID:-00000000-0000-4000-8000-000000000001}
      SUPERSET_USERNAME: ${SUPERSET_USERNAME:-admin}
      SUPERSET_PASSWORD: ${SUPERSET_PASSWORD:-admin}
      DEVIN_API_KEY: ${DEVIN_API_KEY:-}
      DEVIN_ORG_ID: ${DEVIN_ORG_ID:-}
      DEVIN_TRIAGE_AUTOMATION_ID: ${DEVIN_TRIAGE_AUTOMATION_ID:-}
      DEVIN_TRIAGE_WEBHOOK_URL: ${DEVIN_TRIAGE_WEBHOOK_URL:-}
      DEVIN_TRIAGE_WEBHOOK_SECRET: ${DEVIN_TRIAGE_WEBHOOK_SECRET:-}
      DEVIN_REMEDIATION_AUTOMATION_ID: ${DEVIN_REMEDIATION_AUTOMATION_ID:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-engineerA314/superset}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      INCIDENT_DB_PATH: /data/incidents.db
    volumes:
      - ./.state/controller:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      controller:
        condition: service_healthy
    ports:
      - "3000:80"
